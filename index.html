<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fireflies — an evening meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #f7f0e6;
    --ink-dim: rgba(247,240,230,0.62);
    --panel: rgba(20,14,28,0.42);
    --panel-border: rgba(255,226,170,0.18);
    --accent: #ffcb69;
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#0d0a16;
    overflow:hidden;
    font-family:var(--font-ui);
  }
  canvas{
    position:fixed;
    inset:0;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  .ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-rows:auto 1fr auto;
    align-items:start;
    padding:clamp(20px,4vw,44px);
    gap:10px;
    color:var(--ink);
  }
  .masthead{grid-column:1;grid-row:1;}
  .masthead h1{
    font-family:var(--font-display);
    font-weight:500;
    font-style:italic;
    font-size:clamp(26px,4.6vw,42px);
    margin:0;
    letter-spacing:0.3px;
    text-shadow:0 0 34px rgba(255,203,105,0.28);
  }
  .masthead h1 .mark{ color:var(--accent); font-style:normal; }
  .subtitle{
    margin:6px 0 0;
    font-size:12px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .time-toggle{
    grid-column:2;
    grid-row:1;
    justify-self:end;
    display:flex;
    gap:6px;
    pointer-events:all;
  }
  .time-btn{
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--ink-dim);
    font-family:var(--font-ui);
    font-size:12px;
    letter-spacing:0.04em;
    padding:8px 15px;
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .35s ease, color .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .time-btn:hover{ color:var(--ink); border-color:rgba(255,226,170,0.32); }
  .time-btn.active{
    background:linear-gradient(135deg, rgba(255,203,105,0.92), rgba(255,141,110,0.78));
    color:#241408;
    border-color:transparent;
    box-shadow:0 0 20px rgba(255,203,105,0.32);
  }
  .time-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .counter{
    grid-column:1;
    grid-row:3;
    align-self:end;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .hint{
    grid-column:2;
    grid-row:3;
    align-self:end;
    justify-self:end;
    font-size:12px;
    line-height:1.5;
    color:var(--ink-dim);
    text-align:right;
    max-width:250px;
  }

  @media (max-width:560px){
    .ui{ grid-template-columns:1fr; }
    .time-toggle{ grid-column:1; justify-self:start; }
    .hint{ grid-column:1; justify-self:start; text-align:left; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<main class="ui">
  <header class="masthead">
    <h1>Fireflies<span class="mark">.</span></h1>
    <p class="subtitle">an evening meadow, awake with light</p>
  </header>

  <nav class="time-toggle" aria-label="Time of day">
    <button class="time-btn active" data-time="dusk" aria-pressed="true">Dusk</button>
    <button class="time-btn" data-time="midnight" aria-pressed="false">Midnight</button>
    <button class="time-btn" data-time="dawn" aria-pressed="false">Dawn</button>
  </nav>

  <p class="counter" id="counter">56 fireflies dancing</p>
  <p class="hint">Move your lantern through the grass · click to set more fireflies loose</p>
</main>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var counterEl = document.getElementById('counter');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var motionScale = reducedMotion ? 0.3 : 1;

  var W = 0, H = 0;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildStars();
    buildGrass();
  }

  // ---------- colour helpers ----------
  function hexToRgb(hex){
    hex = hex.replace('#','');
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpRgb(a,b,t){ return { r:lerp(a.r,b.r,t), g:lerp(a.g,b.g,t), b:lerp(a.b,b.b,t) }; }
  function rgba(c,a){ return 'rgba(' + (c.r|0) + ',' + (c.g|0) + ',' + (c.b|0) + ',' + a + ')'; }

  // ---------- time-of-day presets ----------
  var PRESETS = {
    dusk: {
      sky: ['#241a3a','#6a3b57','#c9704f'],
      hillFar: '#1b1530',
      hillNear: '#100b1c',
      hue: [38, 52],
      star: 0.45,
      moon: 0.55,
      verb: 'dancing'
    },
    midnight: {
      sky: ['#050410','#0a0e28','#101a38'],
      hillFar: '#08060f',
      hillNear: '#040309',
      hue: [155, 195],
      star: 1,
      moon: 0.85,
      verb: 'glowing'
    },
    dawn: {
      sky: ['#332a52','#7c5a82','#f0a97e'],
      hillFar: '#241d38',
      hillNear: '#141021',
      hue: [8, 40],
      star: 0.12,
      moon: 0.2,
      verb: 'settling'
    }
  };

  function toState(p){
    return {
      sky0: hexToRgb(p.sky[0]), sky1: hexToRgb(p.sky[1]), sky2: hexToRgb(p.sky[2]),
      hillFar: hexToRgb(p.hillFar), hillNear: hexToRgb(p.hillNear),
      hueLo: p.hue[0], hueHi: p.hue[1],
      star: p.star, moon: p.moon
    };
  }

  var currentTime = 'dusk';
  var state = toState(PRESETS.dusk);
  var target = toState(PRESETS.dusk);

  function setPreset(name){
    currentTime = name;
    target = toState(PRESETS[name]);
    counterEl.textContent = fireflies.length + ' fireflies ' + PRESETS[name].verb;
    document.querySelectorAll('.time-btn').forEach(function(b){
      var active = b.dataset.time === name;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function tickState(){
    var r = 0.02;
    state.sky0 = lerpRgb(state.sky0, target.sky0, r);
    state.sky1 = lerpRgb(state.sky1, target.sky1, r);
    state.sky2 = lerpRgb(state.sky2, target.sky2, r);
    state.hillFar = lerpRgb(state.hillFar, target.hillFar, r);
    state.hillNear = lerpRgb(state.hillNear, target.hillNear, r);
    state.hueLo = lerp(state.hueLo, target.hueLo, r);
    state.hueHi = lerp(state.hueHi, target.hueHi, r);
    state.star = lerp(state.star, target.star, r);
    state.moon = lerp(state.moon, target.moon, r);
  }

  // ---------- mouse / touch (the lantern) ----------
  var mouse = { x:0, y:0, active:false };
  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){ mouse.active = false; });
  canvas.addEventListener('touchmove', function(e){
    if(e.touches[0]){
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
    }
  }, { passive:true });
  canvas.addEventListener('touchend', function(){ mouse.active = false; });

  function releaseFireflies(x,y){
    var n = 5;
    for(var i=0;i<n;i++){
      if(fireflies.length >= MAX_FIREFLIES){ fireflies.shift(); }
      fireflies.push(spawnFirefly(
        x + (Math.random()-0.5)*40,
        y + (Math.random()-0.5)*40
      ));
    }
    counterEl.textContent = fireflies.length + ' fireflies ' + PRESETS[currentTime].verb;
  }
  canvas.addEventListener('click', function(e){ releaseFireflies(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function(e){
    if(e.touches[0]) releaseFireflies(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });

  // ---------- stars ----------
  var stars = [];
  function buildStars(){
    stars = [];
    var count = Math.floor((W*H) / 9000);
    for(var i=0;i<count;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H*0.55,
        r: Math.random()*1.3+0.3,
        phase: Math.random()*Math.PI*2,
        speed: Math.random()*0.02+0.006
      });
    }
  }
  function drawStars(t){
    if(state.star <= 0.01) return;
    ctx.save();
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var tw = 0.35 + 0.65*((Math.sin(t*s.speed + s.phase)+1)/2);
      ctx.globalAlpha = tw * state.star;
      ctx.fillStyle = '#fff8ea';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- moon ----------
  function drawMoon(){
    if(state.moon <= 0.01) return;
    var mx = W*0.85, my = H*0.16, r = Math.min(W,H)*0.045;
    ctx.save();
    ctx.globalAlpha = state.moon;
    var glow = ctx.createRadialGradient(mx,my,0,mx,my,r*4.2);
    glow.addColorStop(0,'rgba(255,244,222,0.32)');
    glow.addColorStop(1,'rgba(255,244,222,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx,my,r*4.2,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#fff6e0';
    ctx.beginPath(); ctx.arc(mx,my,r,0,Math.PI*2); ctx.fill();

    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(mx - r*0.38, my - r*0.16, r*0.94, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ---------- hills + grass ----------
  var grass = [];
  function buildGrass(){
    grass = [];
    var count = Math.floor(W/13);
    for(var i=0;i<count;i++){
      grass.push({
        x: Math.random()*W,
        baseY: H*0.90 + Math.random()*H*0.085,
        height: 10 + Math.random()*22,
        phase: Math.random()*Math.PI*2,
        sway: 4 + Math.random()*6
      });
    }
  }
  function drawHills(t){
    ctx.fillStyle = rgba(state.hillFar, 1);
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,H*0.80);
    ctx.bezierCurveTo(W*0.22,H*0.70, W*0.40,H*0.84, W*0.62,H*0.77);
    ctx.bezierCurveTo(W*0.80,H*0.72, W*0.90,H*0.80, W,H*0.78);
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = rgba(state.hillNear, 1);
    ctx.beginPath();
    ctx.moveTo(0,H);
    ctx.lineTo(0,H*0.90);
    ctx.bezierCurveTo(W*0.20,H*0.83, W*0.46,H*0.965, W*0.70,H*0.88);
    ctx.bezierCurveTo(W*0.85,H*0.835, W*0.95,H*0.92, W,H*0.90);
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = rgba(state.hillNear, 1);
    ctx.lineWidth = 2;
    var wind = t * 0.0016 * motionScale;
    for(var i=0;i<grass.length;i++){
      var b = grass[i];
      var s = Math.sin(wind + b.phase) * b.sway * motionScale;
      ctx.beginPath();
      ctx.moveTo(b.x, b.baseY);
      ctx.quadraticCurveTo(b.x + s*0.5, b.baseY - b.height*0.6, b.x + s, b.baseY - b.height);
      ctx.stroke();
    }
  }

  // ---------- lantern glow ----------
  function drawLantern(){
    if(!mouse.active) return;
    var r = 100;
    var g = ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,r);
    g.addColorStop(0,'rgba(255,214,140,0.09)');
    g.addColorStop(1,'rgba(255,214,140,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,r,0,Math.PI*2); ctx.fill();
  }

  // ---------- fireflies ----------
  var MAX_FIREFLIES = 90;
  var fireflies = [];
  function spawnFirefly(x,y){
    return {
      x: x !== undefined ? x : Math.random()*W,
      y: y !== undefined ? y : H*0.20 + Math.random()*H*0.68,
      vx: (Math.random()-0.5)*0.2,
      vy: (Math.random()-0.5)*0.2,
      wanderAngle: Math.random()*Math.PI*2,
      wanderSpeed: (Math.random()*0.01+0.004) * motionScale,
      phase: Math.random()*Math.PI*2,
      blinkSpeed: (Math.random()*0.02+0.012) * (reducedMotion ? 0.6 : 1),
      size: Math.random()*1.6+1.3,
      hueT: Math.random()
    };
  }
  for(var i=0;i<56;i++) fireflies.push(spawnFirefly());

  function updateDrawFireflies(t){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var i=0;i<fireflies.length;i++){
      var f = fireflies[i];

      f.wanderAngle += (Math.random()-0.5)*0.4;
      f.vx += Math.cos(f.wanderAngle)*f.wanderSpeed;
      f.vy += Math.sin(f.wanderAngle)*f.wanderSpeed;

      if(mouse.active){
        var dx = mouse.x - f.x, dy = mouse.y - f.y;
        var dist = Math.sqrt(dx*dx+dy*dy) + 0.001;
        if(dist < 190){
          var pull = (190-dist)/190 * 0.028;
          f.vx += (dx/dist) * pull;
          f.vy += (dy/dist) * pull;
        }
      }

      f.vx *= 0.96; f.vy *= 0.96;
      f.x += f.vx * motionScale; f.y += f.vy * motionScale;

      if(f.y < H*0.12){ f.y = H*0.12; f.vy *= -0.4; }
      if(f.y > H*0.90){ f.y = H*0.90; f.vy *= -0.4; }
      if(f.x < -20) f.x = W+20;
      if(f.x > W+20) f.x = -20;

      f.phase += f.blinkSpeed;
      var blink = (Math.sin(f.phase)+1)/2;
      var alpha = 0.12 + blink*0.85;
      var hue = state.hueLo + (state.hueHi-state.hueLo) * f.hueT;

      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + hue + ',95%,70%,' + alpha + ')';
      ctx.shadowColor = 'hsla(' + hue + ',95%,65%,' + Math.min(1,alpha+0.25) + ')';
      ctx.shadowBlur = 4 + blink*11;
      ctx.arc(f.x, f.y, f.size*(0.6+blink*0.6), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- sky ----------
  function drawSky(){
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, rgba(state.sky0,1));
    g.addColorStop(0.55, rgba(state.sky1,1));
    g.addColorStop(1, rgba(state.sky2,1));
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  // ---------- main loop ----------
  var t = 0;
  function frame(){
    t += 1;
    tickState();
    drawSky();
    drawStars(t);
    drawMoon();
    drawHills(t);
    drawLantern();
    updateDrawFireflies(t);
    requestAnimationFrame(frame);
  }

  document.querySelectorAll('.time-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ setPreset(btn.dataset.time); });
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
